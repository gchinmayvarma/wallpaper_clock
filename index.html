<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chillax</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono&family=Audiowide&family=Oxanium&family=Electrolize&family=Iceland&family=Michroma&family=Exo+2&family=Nova+Mono&display=swap">
</head>

<body>
    <div id="left-controls">
        <button id="grid-btn" class="icon-btn" title="Show all cities">
            <svg viewBox="2 2 20 20" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>
        <button id="city-btn" class="icon-btn" title="Choose cities">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
        </button>
        <div id="city-menu"><div id="city-list"></div></div>
    </div>
    <div id="controls">
        <input id="opacity-slider" type="range" min="10" max="100" title="Clock opacity">
        <button id="font-btn" title="Change font"></button>
    </div>
    <div id="clock" class="clock">
        <span class="am_pm"></span>
        <span class="time_h"></span><span class="time_dh">:</span>
        <span class="time_m"></span>
        <span class="time_s"></span>
        <span class="timezone"></span>
        <div class="day-progress">
            <div class="day-progress-fill"></div>
            <span class="dp-tick dp-25"></span>
            <span class="dp-tick dp-50"></span>
            <span class="dp-tick dp-75"></span>
        </div>
    </div>
    <div id="grid"></div>
    <script src="script.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    </script>
</body>

</html>
